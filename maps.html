<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Maker · LANCERTools</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
<style>
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .tools button { display: flex; align-items: center; gap: 7px; text-align: left; padding: 3px 7px; }
  .tools button .sw { width: 10px; height: 10px; flex: none; border: 1px solid #000a; }
  .tools button[disabled] { opacity: 0.4; }
  .setting { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: center; font-size: 13px; }
  .setting output { font-size: 12px; color: var(--link); font-variant-numeric: tabular-nums; }
  .setting input[type=range] { grid-column: 1 / -1; width: 100%; height: 16px; }
  .setting.toggle { grid-template-columns: auto 1fr; }
  .group-name { font-weight: 700; color: var(--head); font-size: 13px; margin-top: 2px; }
  .field { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; }
  .dims input { width: 58px; }
  .blurb { font-style: italic; font-size: 13px; }
  #stage canvas { position: absolute; left: 0; top: 0; }
  #over { cursor: crosshair; }
  #over.pan { cursor: grab; }
  .hud { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; pointer-events: none; }
  .hud span { background: #1c1c1cdd; border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; font-size: 12.5px; color: var(--text); }
  .hud .busy { color: var(--link); }
  .hud .err { color: var(--danger); }
  .viewbar { position: absolute; right: 10px; top: 10px; }
  .viewbar button { background: #222e; padding: 2px 10px; }
  .viewbar button[aria-pressed="true"] { background: var(--gold); }
  .out { font-size: 12.5px; color: var(--link); }
</style>
</head>
<body class="app">
<header class="topbar" data-page="maps" data-title="Map Maker"
  data-tagline="Paint on the map, set the look on the left. <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>F</kbd> fit · <kbd>E</kbd> edits · <kbd>G</kbd> grid"></header>
<div class="workspace">
  <aside class="sidebar">
    <div class="section">
      <h2 class="sec"><span class="grow">Map</span></h2>
      <label class="field"><span class="label">Name</span><input id="name"></label>
      <div class="field dims">
        <span class="label">Size</span>
        <span class="row"><input id="cols" type="number" min="3" max="60" title="Columns"> × <input id="rows" type="number" min="3" max="60" title="Rows">
        <span class="hint">hexes</span></span>
      </div>
      <label class="field"><span class="label">Style</span><select id="style"></select></label>
      <div class="blurb" id="styleBlurb"></div>
    </div>
    <div class="section">
      <h2 class="sec"><span class="grow">Paint</span></h2>
      <div class="tools" id="tools"></div>
      <div class="hint" id="toolHint"></div>
    </div>
    <div class="section">
      <h2 class="sec"><span class="grow">Style settings</span><span class="toggle" id="resetOpts" title="Back to the style's designed look">reset</span></h2>
      <div id="settings" class="section" style="gap:8px"></div>
    </div>
    <div class="section">
      <h2 class="sec"><span class="grow">File</span></h2>
      <div class="btn-group"><button id="new">New</button><button id="open">Open…</button><button id="save">Save .json</button></div>
      <input type="file" id="file" accept=".json,application/json" hidden>
      <button class="go" id="png">Download base map (PNG)</button>
      <div class="out" id="out"></div>
      <div class="hint">Drawn at 2× for sharp zooming. In Roll20, set the image to the size in the file name, its top-left corner on
        the page's top-left. Terrain goes on as tokens (<a href="tokens.html">Token Kit</a>).</div>
    </div>
  </aside>
  <section class="stage" id="stage">
    <canvas id="base"></canvas>
    <canvas id="over"></canvas>
    <div class="viewbar btn-group">
      <button id="edits" aria-pressed="true" title="Show what you painted (E)">Edits</button>
      <button id="grid" aria-pressed="true" title="Hex grid (G)">Grid</button>
      <button id="fit" title="Fit the map (F)">Fit</button>
      <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
    </div>
    <div class="hud"><span id="hover">–</span><span id="status">Ready</span></div>
  </section>
</div>
<script type="module" src="js/ui/topbar.js"></script>
<script type="module" src="js/ui/mapmaker.js"></script>
<script type="module" src="js/ui/collapse.js"></script>
</body>
</html>
